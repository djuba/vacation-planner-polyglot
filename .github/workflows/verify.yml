# Mirrors the local project gate on pull requests (CLAUDE.md §6.7). The local gates stay the
# source of truth; this job never needs secrets because gated tests never call a live LLM (§6.1).
# Required status check on `main`; with "require branches to be up to date" this enforces
# merge commit with semi-linear history (§10).
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # WU-02 replaces these with `pnpm verify`.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
