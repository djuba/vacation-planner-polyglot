packages:
  - apps/*
  - backends/api-nextjs
  - packages/*
  - tests/contract
  - tests/journeys

catalog:
  '@ai-sdk/anthropic': 4.0.89
  '@ai-sdk/react': 4.0.158
  '@playwright/test': 1.64.1
  '@vitest/coverage-v8': 5.0.5
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  ai: 7.0.154
  ajv: 8.20.0
  ajv-formats: 3.0.1
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  vitest: 5.0.5
  next: 16.4.5
  yaml: 2.9.1
  zod: 4.6.7

saveExact: true
engineStrict: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.72.1'
  - '@typescript-eslint/parser@8.72.1'
  - '@typescript-eslint/project-service@8.72.1'
  - '@typescript-eslint/scope-manager@8.72.1'
  - '@typescript-eslint/tsconfig-utils@8.72.1'
  - '@typescript-eslint/type-utils@8.72.1'
  - '@typescript-eslint/types@8.72.1'
  - '@typescript-eslint/typescript-estree@8.72.1'
  - '@typescript-eslint/utils@8.72.1'
  - '@typescript-eslint/visitor-keys@8.72.1'
  - typescript-eslint@8.72.1

# lefthook installs hooks via the root `prepare` script, not its postinstall (WU-02 D4).
allowBuilds:
  lefthook: false
